<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF00FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadowPurple" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#BF00FF" flood-opacity="0.15"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .terminal-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .c-dim { fill: #6E7681; }
      .c-white { fill: #F0F6FC; }
      .c-purple { fill: #BF00FF; font-weight: 700; }
      .c-cyan { fill: #00F0FF; }
      .c-green { fill: #00FF66; font-weight: 600; }
      .c-red { fill: #FF3366; font-weight: 700; }
      .c-yellow { fill: #FFBD2E; font-weight: 600; }
      .c-magenta { fill: #FF007F; }

      @keyframes cycleAnim {
        0% { opacity: 0; transform: translateY(4px); }
        3% { opacity: 1; transform: translateY(0); }
        92% { opacity: 1; transform: translateY(0); }
        98% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
        fill: #BF00FF;
      }

      .anim-l0 { animation: cycleAnim 13s ease infinite; animation-delay: 0.1s; }
      .anim-l1 { animation: cycleAnim 13s ease infinite; animation-delay: 1.0s; }
      .anim-l2 { animation: cycleAnim 13s ease infinite; animation-delay: 2.1s; }
      .anim-l3 { animation: cycleAnim 13s ease infinite; animation-delay: 3.2s; }
      .anim-l4 { animation: cycleAnim 13s ease infinite; animation-delay: 4.4s; }
      .anim-l5 { animation: cycleAnim 13s ease infinite; animation-delay: 5.5s; }
      .anim-l6 { animation: cycleAnim 13s ease infinite; animation-delay: 6.7s; }
      .anim-l7 { animation: cycleAnim 13s ease infinite; animation-delay: 7.8s; }
      .anim-l8 { animation: cycleAnim 13s ease infinite; animation-delay: 8.9s; }
      .anim-l9 { animation: cycleAnim 13s ease infinite; animation-delay: 10.0s; }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="10" y="10" width="860" height="450" rx="12" ry="12" fill="#0D0A14" stroke="#BF00FF" stroke-width="1.5" stroke-opacity="0.4" filter="url(#shadowPurple)"/>

  <!-- Titlebar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" fill="#181124"/>
  <line x1="10" y1="46" x2="870" y2="46" stroke="#2B1D40" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="28" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="440" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" font-weight="500">
    agent-memory-mesh — bi-temporal memory &amp; lossless compression — 860x450
  </text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(30, 80)">
    
    <!-- Line 0: Command Invocation -->
    <g class="anim-l0">
      <text x="0" y="0">
        <tspan class="c-purple">❯ </tspan>
        <tspan class="c-cyan">memory-mesh</tspan>
        <tspan class="c-white"> query </tspan>
        <tspan class="c-dim">--subject "customer:acme_corp" --predicate "plan" --bitemporal</tspan>
      </text>
    </g>

    <!-- Line 1: Graph Status -->
    <g class="anim-l1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="c-dim">[MEMORY-MESH]</tspan>
        <tspan class="c-purple"> Bi-Temporal Causality Graph Active</tspan>
        <tspan class="c-dim"> — Tenant: </tspan><tspan class="c-white">org_benni</tspan>
      </text>
    </g>

    <!-- Line 2: Past Fact Added -->
    <g class="anim-l2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="c-cyan">● [2026-01-01T00:00:00Z]</tspan>
        <tspan class="c-white"> Fact: </tspan>
        <tspan class="c-yellow">(customer:acme)</tspan><tspan class="c-dim"> -[plan]-> </tspan><tspan class="c-white">"free_tier"</tspan>
        <tspan class="c-dim"> [provenance: onboarding_form]</tspan>
      </text>
    </g>

    <!-- Line 3: Upgrade Event -->
    <g class="anim-l3" transform="translate(0, 80)">
      <text x="0" y="0">
        <tspan class="c-cyan">● [2026-06-01T00:00:00Z]</tspan>
        <tspan class="c-white"> Update: </tspan>
        <tspan class="c-yellow">(customer:acme)</tspan><tspan class="c-dim"> -[plan]-> </tspan><tspan class="c-green">"enterprise"</tspan>
        <tspan class="c-dim"> [provenance: stripe_webhook]</tspan>
      </text>
    </g>

    <!-- Line 4: Query Present -->
    <g class="anim-l4" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="c-green">✔ Query Result (Present / 2026-10-18):</tspan>
        <tspan class="c-green"> "enterprise"</tspan>
        <tspan class="c-dim"> (Valid time active, 0 contradictions)</tspan>
      </text>
    </g>

    <!-- Line 5: Query Time Travel -->
    <g class="anim-l5" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="c-magenta">⌛ Time-Travel Query (As-of 2026-03-15):</tspan>
        <tspan class="c-white"> "free_tier"</tspan>
        <tspan class="c-dim"> (Historical audit truth 100% preserved)</tspan>
      </text>
    </g>

    <!-- Line 6: Compression reduction -->
    <g class="anim-l6" transform="translate(0, 172)">
      <text x="0" y="0">
        <tspan class="c-purple">● LOSSLESS COMPRESSION ENGINE:</tspan>
        <tspan class="c-cyan"> Budget: 500 tokens</tspan>
      </text>
    </g>

    <!-- Line 7: Compression Result -->
    <g class="anim-l7" transform="translate(0, 196)">
      <text x="0" y="0">
        <tspan class="c-dim">  └─ Context Window: </tspan>
        <tspan class="c-white">1,840 tokens → </tspan><tspan class="c-green">476 tokens</tspan>
        <tspan class="c-dim"> (</tspan><tspan class="c-green">-74.1% cost reduction</tspan><tspan class="c-dim">, zero semantic loss)</tspan>
      </text>
    </g>

    <!-- Line 8: Integrity Seal -->
    <g class="anim-l8" transform="translate(0, 230)">
      <text x="0" y="0">
        <tspan class="c-dim">[GRAPH DIGEST] SHA-256: </tspan>
        <tspan class="c-purple">a7f1e940b3c2d815e9...</tspan>
        <tspan class="c-dim"> | Checkpoint: </tspan><tspan class="c-green">ATOMIC_LOCKED</tspan>
      </text>
    </g>

    <!-- Line 9: Prompt & Cursor -->
    <g class="anim-l9" transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan class="c-purple">❯ </tspan>
        <tspan class="c-dim">Agent memory synchronized. Ready for multi-turn sessions.</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="10" y="457" width="860" height="3" fill="url(#headerGradPurple)" rx="1.5"/>
</svg>
